<!DOCTYPE html>
<html>
<head>
    <title>My Flask Application</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .navbar {
            background: #222;
            color: white;
            padding: 20px 40px;
            font-size: 22px;
            font-weight: bold;
        }

        .container {
            padding: 50px;
            text-align: center;
        }

        .card {
            background: white;
            max-width: 700px;
            margin: auto;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 40px;
        }

        .status {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 20px;
            background: #e6f7e6;
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="navbar">
        🚀 My Flask Application
    </div>

    <div class="container">

        <div class="card">

            <h1>Hello from Docker!</h1>
            <h2> life is too short do it as soon as possible</h2>
            <h3> do  what u can do </h3>
            <p>
                This website is running using
                <strong>Flask inside a Docker container.</strong>
            </p>

            <p class="status">
                ● Application Running
            </p>

        </div>

    </div>

</body>
</html>
